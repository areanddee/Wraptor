# Configuration for Cubed-Sphere Thermal Diffusion Solver
# Complete config for Framework execution

solver:
  type: fv_cubesphere_diffusion
  N: 60                # Grid resolution (N×N per face)
  kappa: 5.0e+5         # Diffusion coefficient [m²/s]
  precision: 'f64'     # 'f32' or 'f64' for solver arrays

# Physical parameters (SINGLE SOURCE OF TRUTH)
physics:
  R_sphere: 6.371e+6   # Planet radius [m]
  gravity: 9.81        # Surface gravity [m/s²]
  omega: 7.292e-5      # Rotation rate [rad/s]
  name: Earth

# Initial condition
initial_condition:
  type: lima_flag
  T_hot: 600.0         # Hot quadrant temperature [K]
  T_background: 1.0    # Background temperature [K]

parallelization:
  enable_sharding: false    # Set true for multi-device
  tiles_per_edge: 1         # Tiles per cube edge (1 = 6 tiles total)
                            # Currently ONLY tiles_per_edge=1 is supported
  device_type: 'cpu'        # 'cpu' or 'gpu'
  num_devices: 1            # Number of devices (must evenly divide num_tiles)
                            # Valid for tiles_per_edge=1: 1, 2, 3, 6 devices

time_integration:
  dt: 1800                  # Timestep [s] (30 minutes)
  num_steps: 48             # Total steps (1 day simulation)

io:
  output_dir: ./output_diffusion
  checkpoint_dir: ./checkpoints_diffusion
  output:
    state:
      frequency: 12         # Save every 12 steps (6 hours)
      enabled: true
    diagnostics:
      frequency: 1          # Save every step
      enabled: true
  checkpoint_frequency: 24  # Checkpoint every 24 steps (12 hours)
  diagnostic_frequency: 4   # Print diagnostics every 4 steps (2 hours)
  max_checkpoints: 3

